[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenix-ntru"
version = "1.0.0"
description = "An educational NTRU lattice-based encryption library"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "iamv1n" }]
keywords = ["ntru", "lattice", "post-quantum", "cryptography", "kem"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]
dependencies = ["numpy>=1.24", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
phoenix = "phoenix.cli:main"

[project.urls]
Homepage = "https://github.com/iamv1n/phoenix"
Issues = "https://github.com/iamv1n/phoenix/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"phoenix.playground" = ["index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
